[package]
name = "sci-family-pilot"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Pilotage administratif automatisé d'une SCI familiale à l'IR"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server", "dep:sqlx", "dep:tokio", "dep:dotenvy", "dep:tracing-subscriber"]
test-auth = []

[dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
dioxus = { version = "0.7.0", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
tracing = "0.1"
argon2 = "0.5"
sha2 = "0.10"
js-sys = "0.3"

sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "migrate", "macros", "json"] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "time", "sync", "process"] }
dotenvy = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt", "json"] }
rust_decimal = { version = "1", features = ["serde", "db-postgres"] }
getrandom = { version = "0.4", features = ["wasm_js"] }


[profile.dev]
opt-level = 0
incremental = true
debug = false

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.sqlx-macros]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "sci-family-migrate"
path = "src/bin/sci-family-migrate.rs"
required-features = ["server"]
